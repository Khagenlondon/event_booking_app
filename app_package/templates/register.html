{% extends "base.html" %}
{% block content %}
<h1>Register</h1>
<form method="post">
    <label>Email:
        <input type="email" name="email" required>
    </label><br>
    <label>Name:
        <input type="text" name="name" required>
    </label><br>
    <label>Password:
        <input type="password" name="password" required minlength="4">
    </label><br>
    <button type="submit">Register</button>
</form>
{% endblock %}
